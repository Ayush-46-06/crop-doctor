services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cropdoctor-backend
    command: ["backend"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_ALLOWED_HOSTS=127.0.0.1,localhost,backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cropdoctor-frontend
    command: ["frontend"]
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://backend:8000/api/analyze/
    depends_on:
      backend:
        condition: service_healthy
