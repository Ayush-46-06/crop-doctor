services:
  - type: web
    name: crop-doctor-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "127.0.0.1,localhost,0.0.0.0,.onrender.com,*"
      - key: API_URL
        value: "http://127.0.0.1:8000/api/analyze/"
      - key: PORT
        value: "8501"
      - key: PYTHONOPTIMIZE
        value: "1"

